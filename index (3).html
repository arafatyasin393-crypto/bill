<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আকরাম বানিজ্য ভান্ডার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#eef2ee;--sf:#fff;--ink:#16251c;--mu:#56665c;--ln:#cfdbd1;--gr:#1d5a40;--gi:#fff;--due:#b45f06;--ok:#1b7a4b;--soft:#e2ede4;--bad:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1913;--sf:#16251c;--ink:#e7f0e9;--mu:#9bada1;--ln:#2a3e32;--gr:#5fc08f;--gi:#0e1913;--due:#f0b24a;--ok:#6fd29b;--soft:#1d3226;--bad:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1913;--sf:#16251c;--ink:#e7f0e9;--mu:#9bada1;--ln:#2a3e32;--gr:#5fc08f;--gi:#0e1913;--due:#f0b24a;--ok:#6fd29b;--soft:#1d3226;--bad:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Kalpurush",system-ui,sans-serif;font-size:17px;line-height:1.5;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h1{margin:0;font-size:1.5rem;line-height:1.25;color:var(--gr)}
header p{margin:0;color:var(--mu);font-size:.92rem}
.arot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:.98rem}
.arot a{color:var(--gr);font-weight:700;text-decoration:none}
#arotF{display:flex;gap:8px;margin-top:8px}#arotF[hidden]{display:none}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;min-height:48px}
input[type=checkbox]{width:22px;min-height:22px;height:22px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gr);outline-offset:2px}
label{display:block;font-weight:600;font-size:.93rem;margin:12px 0 4px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--gr);color:var(--gi);border:0;border-radius:8px;font-weight:700;min-height:48px;padding:0 16px;white-space:nowrap}
.btn:disabled{opacity:.5}
.btn.full{width:100%;margin-top:14px}
.lnk{background:none;border:1px solid var(--ln);border-radius:6px;color:var(--mu);padding:4px 12px;min-height:38px;font-size:.9rem}
.lnk.arm,.arm{border-color:var(--bad);color:var(--bad);font-weight:600}
.bar{display:flex;gap:8px;margin:12px 0}
.chips{display:flex;gap:8px;margin:10px 0}
.chip{border:2px solid var(--ln);background:var(--sf);border-radius:20px;min-height:42px;padding:0 18px;font-weight:600}
.chip.on{border-color:var(--gr);background:var(--soft);color:var(--gr)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:12px 8px;background:var(--sf);border:1px solid var(--ln);border-radius:14px}
.pc:active{background:var(--soft)}
.im{width:84px;height:84px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden;flex:none}
.im img{width:100%;height:100%;object-fit:cover}
.im.sm{width:52px;height:52px;font-size:28px;border-radius:10px}
.mu{color:var(--mu);font-size:.85rem}
.stk{font-size:.85rem;font-weight:600;color:var(--ok)}.stk.lo{color:var(--due)}
.bd{position:absolute;top:8px;right:8px;background:var(--gr);color:var(--gi);border-radius:12px;min-width:28px;padding:0 8px;font-weight:700;font-size:.9rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px}
.row .info{flex:1;min-width:0}
.row .act{display:flex;flex-direction:column;gap:6px}
.cbtn{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 14px;cursor:pointer;min-height:58px}
.cbtn:focus-visible{outline:3px solid var(--gr);outline-offset:-3px}
.due{font-weight:700;font-size:1.1rem;color:var(--due);white-space:nowrap}.due.ok{color:var(--ok)}
.ledger{border-top:1px dashed var(--ln);padding:4px 14px 10px}
.ent{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--ln)}
.ent:last-child{border-bottom:0}
.ent .a{font-weight:700;white-space:nowrap}.ent .a.s{color:var(--due)}.ent .a.p{color:var(--ok)}
.ent .x{grid-column:1/-1;text-align:right}
.call{display:flex;align-items:center;min-height:46px;padding:0 14px;border-top:1px dashed var(--ln);color:var(--gr);font-weight:700;text-decoration:none}
.total{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--due);border-radius:8px;padding:12px 14px}
.total .big{font-size:2.2rem;font-weight:700;color:var(--due);line-height:1.2}
.empty{padding:26px 10px;text-align:center;color:var(--mu)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--sf);border-top:1px solid var(--ln);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;border-top:3px solid transparent;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:.85rem;font-weight:600;color:var(--mu)}
.nav button span{font-size:1.35rem;line-height:1.1}
.cal{display:inline-flex;flex-direction:column;width:28px;height:28px;border:1.5px solid var(--mu);border-radius:5px;overflow:hidden;font-style:normal;line-height:1;background:var(--sf)}
.cal u{text-decoration:none;background:#c0392b;color:#fff;font-size:8px;text-align:center;padding:2px 0 1px}
.cal b{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink)}
.nav button{font-size:.72rem!important;padding:0 2px;line-height:1.15;text-align:center}
.nav button[aria-selected=true]{color:var(--gr);border-top-color:var(--gr);background:var(--soft)}
.cbar{position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;justify-content:space-between;align-items:center;background:var(--gr);color:var(--gi);border:0;border-radius:14px;padding:14px 16px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.cbar[hidden]{display:none}
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#ov[hidden]{display:none}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;margin-bottom:4px}
.x{background:none;border:0;font-size:1.4rem;min-width:44px;min-height:44px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{margin:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;text-align:center;min-height:50px;border:2px solid var(--ln);border-radius:8px;background:var(--sf);font-weight:600;cursor:pointer}
.seg input:checked+span{border-color:var(--gr);background:var(--soft);color:var(--gr)}
.seg input:focus-visible+span{outline:3px solid var(--gr);outline-offset:2px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;min-height:140px;resize:vertical}
button.call{all:unset;box-sizing:border-box;display:flex;align-items:center;width:100%;min-height:46px;padding:0 14px;border-top:1px dashed var(--ln);color:var(--gr);font-weight:700;cursor:pointer}
button.call:focus-visible{outline:3px solid var(--gr);outline-offset:-3px}
.chg{display:flex;flex-wrap:wrap;gap:8px}
.chg label{margin:0}
.chg input{position:absolute;opacity:0;pointer-events:none}
.chg span{display:flex;align-items:center;min-height:46px;padding:0 16px;border:2px solid var(--ln);border-radius:22px;background:var(--sf);font-weight:600;cursor:pointer}
.chg input:checked+span{border-color:var(--gr);background:var(--soft);color:var(--gr)}
.chg input:focus-visible+span{outline:3px solid var(--gr);outline-offset:2px}
.cl{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.ci{flex:1;min-width:0}
.ctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.ctl input{min-height:42px;padding:6px;text-align:center;width:72px}
.ctl button{width:42px;min-height:42px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);font-size:1.3rem;font-weight:700;padding:0}
.ct{text-align:right;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
#sum{margin-top:14px;padding:12px;background:var(--soft);border-radius:8px}
#sum .big{font-size:1.6rem;font-weight:700}
.msg{margin-top:10px;min-height:1.4em;font-size:.95rem}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.prev{margin-top:12px;display:flex;align-items:center;gap:12px}
.paper{background:#fff;color:#000;border:1px dashed var(--ln);border-radius:4px;padding:12px;margin:10px auto;max-width:320px}
.note{margin-top:20px;font-size:.88rem;color:var(--mu)}
#rcpt{display:none;width:72mm}
.rc{color:#000;font-size:13px;line-height:1.4;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
.rh{text-align:center}.rl{border-top:1px dashed #000;margin:6px 0}.rr{display:flex;justify-content:space-between;gap:8px}.ri{margin:4px 0}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  :root{padding:0!important}
  body>*:not(#rcpt){display:none!important}
  #rcpt{display:block!important;margin:0;padding:2mm 3mm}
  @page{margin:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>আকরাম বানিজ্য ভান্ডার</h1>
    <p>পাইকারি কাঁচা ও পাকা মালের আড়ৎ</p>
    <div class="arot"><span id="arotTxt"></span><button type="button" id="arotBtn" class="lnk" data-a="arot">নম্বর লিখুন</button></div>
    <div class="arot"><button type="button" id="bkopen" class="lnk">💾 ব্যাকআপ / ডেটা নিরাপত্তা</button></div>
    <form id="arotF" hidden><input type="tel" id="arotIn" inputmode="tel" maxlength="20" placeholder="আড়তের ফোন নম্বর" aria-label="আড়তের ফোন নম্বর"><button class="btn" type="submit">রাখুন</button></form>
  </header>

  <section id="v-pos">
    <input type="search" id="q" placeholder="মাল খুঁজুন" aria-label="মাল খুঁজুন" style="margin-top:12px">
    <button type="button" class="btn" id="rbbtn" data-a="rb" style="width:100%;margin-top:10px"></button>
    <div class="chips" id="chips"></div>
    <div id="pgrid"></div>
  </section>

  <section id="v-items" hidden>
    <div class="bar"><input type="search" id="iq" placeholder="মাল খুঁজুন" aria-label="মাল খুঁজুন"><button class="btn" id="newp" data-a="pform">+ নতুন মাল</button></div>
    <div id="ilist"></div>
  </section>

  <section id="v-baki" hidden>
    <div class="bar" style="margin-top:12px"><input type="search" id="cq" placeholder="গ্রাহকের নাম খুঁজুন" aria-label="গ্রাহক খুঁজুন"><button class="btn" id="newe" data-a="eform">+ বাকি / জমা</button></div>
    <div class="chips" id="bchips" style="margin:10px 0 0"></div>
    <div class="total" style="margin-top:10px"><div class="mu" id="bLbl">মোট বাকি, যা আমি পাব</div><div class="big" id="tDue">৳ ০</div><div class="mu" id="tSub"></div></div>
    <div id="blist" style="margin-top:12px"></div>
  </section>

  <section id="v-memo" hidden>
    <div id="mlist" style="margin-top:12px"></div>
  </section>

  <section id="v-day" hidden>
    <div class="chips" id="pchips" style="margin-top:12px;flex-wrap:wrap"></div>
    <div class="bar" id="pctl"></div>
    <div id="dbody"></div>
  </section>

  <section id="v-contacts" hidden>
    <div class="chips" id="cchips" style="margin-top:12px"></div>
    <div class="bar"><input type="search" id="kq" placeholder="নাম বা ফোন খুঁজুন" aria-label="খুঁজুন"><button class="btn" id="newc" data-a="cform">+ নতুন গ্রাহক</button></div>
    <div id="clist"></div>
  </section>

  <div id="bkbox" hidden>
    <p class="note" id="stor"></p>
    <p class="note" id="bklast"></p>
    <button type="button" class="btn full" id="bkbtn">💾 এখনই সব ডেটার ব্যাকআপ নামান</button>
    <p><button type="button" class="lnk" id="shbtn" style="width:100%;min-height:46px">📤 ব্যাকআপ শেয়ার করুন (Drive/WhatsApp)</button></p>
    <input type="file" id="rsfile" accept="application/json,.json" hidden>
    <p><button type="button" class="lnk" id="rsbtn" style="width:100%;min-height:46px">📂 ব্যাকআপ থেকে ফিরিয়ে আনুন</button></p>
    <div class="msg" id="bkmsg" role="status"></div>
  </div>
</div>

<button type="button" class="cbar" id="cbar" data-a="cart" hidden></button>
<nav class="nav" id="nav" role="tablist"></nav>
<div id="ov" hidden><div class="sh" id="shc" role="dialog" aria-modal="true"></div></div>
<datalist id="custs"></datalist>
<datalist id="sups"></datalist>
<datalist id="khs"></datalist>
<datalist id="itemnames"></datalist>
<div id="rcpt"></div>

<script>
/* নিজের https সাইটে চালানোর জন্য ডেটা স্তর: ডেটা এই ফোনের ব্রাউজারে (IndexedDB) জমা থাকে */
(function(){
const nid=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const mem={},subs={},imgs={},blobs={};let idb;
const rq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const os=m=>idb.transaction('kv',m).objectStore('kv');
const put=(k,v)=>rq(os('readwrite').put(v,k));
const ready=(async()=>{
  idb=await new Promise((ok,no)=>{const r=indexedDB.open('akram-khata',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
  const ks=await rq(os('readonly').getAllKeys()),vs=await rq(os('readonly').getAll());
  ks.forEach((k,i)=>{if(k.startsWith('col:'))mem[k.slice(4)]=vs[i];else if(k.startsWith('img:')){blobs[k.slice(4)]=vs[i];imgs[k.slice(4)]=URL.createObjectURL(vs[i])}});
})();
const cp=d=>JSON.parse(JSON.stringify(d));
const snap=n=>({docs:Object.entries(mem[n]||{}).map(([id,d])=>({id,data:()=>cp(d)}))});
const dsnap=(n,id)=>{const d=(mem[n]||{})[id];return{exists:d!==undefined,id,data:()=>d===undefined?undefined:cp(d)}};
const fire=n=>(subs[n]||[]).forEach(f=>f());
async function wr(n,id,d){const c=mem[n]=mem[n]||{};if(d===null)delete c[id];else c[id]=cp(d);await put('col:'+n,c);fire(n)}
const sub=(n,f)=>{(subs[n]=subs[n]||[]).push(f);f();return()=>{}};
const docRef=(n,id)=>({id,set:d=>wr(n,id,d),delete:()=>wr(n,id,null),get:async()=>dsnap(n,id),onSnapshot:cb=>sub(n,()=>cb(dsnap(n,id)))});
const colRef=n=>({doc:id=>docRef(n,id),add:async d=>{const id=nid();await wr(n,id,d);return{id}},onSnapshot:cb=>sub(n,()=>cb(snap(n)))});
const DB={collection:colRef,doc:p=>{const a=p.split('/');return docRef(a[0],a[1])}};
const assets={upload:async b=>{const id=nid();blobs[id]=b;imgs[id]=URL.createObjectURL(b);await put('img:'+id,b);return{id}}};
let shareNext=false;
const dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:/\.html$/.test(filename)?'text/html':'text/plain'});
  if(shareNext){shareNext=false;try{const f=new File([b],filename,{type:b.type||'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:filename});return}}catch(e){if(e&&e.name==='AbortError')throw{code:'declined'}}}
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}};
window.imgUrl=id=>imgs[id]||'';
window.photoBlob=async id=>blobs[id];
window.claude={use:async n=>n==='db'?(await ready,DB):n==='user'?{isOwner:async()=>true}:n==='assets'?assets:n==='downloads'?dl:null};
/* ব্যাকআপ থেকে ফিরিয়ে আনা */
const rb=document.getElementById('rsbtn'),rf=document.getElementById('rsfile'),msg=document.getElementById('bkmsg');
const say=(t,c)=>{msg.textContent=t;msg.className='msg '+c};
rb.onclick=()=>rf.click();
rf.onchange=async()=>{
  const f=rf.files[0];if(!f)return;
  try{
    const j=JSON.parse(await f.text());if(!j||j.v!==1||!j.data)throw 0;
    if(!confirm('এই ফোনের বর্তমান সব ডেটা মুছে ব্যাকআপের ডেটা বসানো হবে। চালিয়ে যাবেন?')){rf.value='';return}
    await ready;
    for(const k of ['products','moves','entries','memos','contacts','running','cash']){const o={};(j.data[k]||[]).forEach(d=>{const r=Object.assign({},d);const id=r.id;delete r.id;o[id]=r});mem[k]=o;await put('col:'+k,o)}
    mem.settings={arot:{phone:j.arot||''}};await put('col:settings',mem.settings);
    for(const id of Object.keys(j.photos||{})){const b=await (await fetch(j.photos[id])).blob();blobs[id]=b;imgs[id]=URL.createObjectURL(b);await put('img:'+id,b)}
    say('ডেটা ফিরে এসেছে। পেজ নতুন করে খুলছে...','ok');setTimeout(()=>location.reload(),800);
  }catch(e){say('ব্যাকআপ ফাইলটি পড়া যায়নি।','err')}
  rf.value='';
};

document.getElementById('shbtn').onclick=()=>{shareNext=true;window.backupAll()};
const ldate=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const toast=m=>{const e=document.createElement('div');e.textContent=m;e.style.cssText='position:fixed;left:12px;right:12px;bottom:90px;z-index:99;background:#1d5a40;color:#fff;padding:12px 14px;border-radius:10px;text-align:center;font-weight:600';document.body.appendChild(e);setTimeout(()=>e.remove(),5000)};
ready.then(async()=>{
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  const has=Object.keys(mem).some(k=>k!=='settings'&&Object.keys(mem[k]||{}).length);
  if(!has)return;
  let last=null;try{last=await rq(os('readonly').get('meta:lastBackup'))}catch(e){}
  if(last===ldate())return;
  const go=async()=>{
    document.removeEventListener('pointerdown',go,true);
    try{await window.backupAll();await put('meta:lastBackup',ldate());toast('আজকের অটো ব্যাকআপ নামানো হয়েছে (Downloads ফোল্ডারে)')}catch(e){}
  };
  document.addEventListener('pointerdown',go,true);
});

<script>

const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pdt=x=>new Date(x+'T00:00:00');
function period(){
  const a=pdt(st.dd||today());let f,t;
  if(st.pm==='day'){f=t=iso(a)}
  else if(st.pm==='week'){const wd=(a.getDay()+1)%7,s0=new Date(a);s0.setDate(a.getDate()-wd);const e0=new Date(s0);e0.setDate(s0.getDate()+6);f=iso(s0);t=iso(e0)}
  else if(st.pm==='month'){f=iso(new Date(a.getFullYear(),a.getMonth(),1));t=iso(new Date(a.getFullYear(),a.getMonth()+1,0))}
  else if(st.pm==='year'){f=a.getFullYear()+'-01-01';t=a.getFullYear()+'-12-31'}

function rangeData(f,t){
  const inR=d=>d>=f&&d<=t;
  const ms=S.memos.filter(m=>inR(m.date));
  const en=S.entries.filter(e=>inR(e.date)&&!e.mid),le=ty=>r2(en.filter(e=>e.type===ty).reduce((a,e)=>a+eff(e),0));
  const rl=[],cin=[],cout=[];let sales=0;
  S.running.forEach(r=>{
    const owe=r.jdir==='owe',by={};
    r.lines.forEach(l=>{if(inR(l.date)){if(owe)by[l.date]=r2((by[l.date]||0)+lamt(l,r));else rl.push(lamt(l,r))}});
    Object.entries(by).forEach(([d,a])=>cout.push({d,w:r.customer,n:'চালান',a}));
    if(!owe)(r.pays||[]).forEach(x=>{if(inR(x.date))cin.push({d:x.date,w:r.customer,n:'রানিং বিল',a:x.amount})});
  });
  S.memos.forEach(m=>{
    const n='বিল নং '+bnn.format(m.no),owe=m.mode==='owe';
    if(m.items&&m.items.some(i=>i.date)){
      const by={};m.items.forEach(i=>{if(inR(i.date))by[i.date]=r2((by[i.date]||0)+i.qty*i.rate)});
      Object.entries(by).forEach(([d,a])=>{if(owe)cout.push({d,w:m.customer,n:'চালান ('+n+')',a});else sales=r2(sales+a)});
      if(!owe&&inR(m.date)&&m.paid>0)cin.push({d:m.date,w:m.customer,n,a:m.paid});
    }else if(inR(m.date)){
      if(!owe)sales=r2(sales+m.total);
      if(m.paid>0)(owe?cout:cin).push({d:m.date,w:m.customer,n,a:m.paid});
    }
    if(m.gave>0&&inR(m.date))cout.push({d:m.date,w:m.customer,n,a:m.gave});
  });
  en.forEach(e=>{if(e.type==='pay')cin.push({d:e.date,w:e.customer,n:'বাকি খাতা',a:e.amount});if(e.type==='gave')cout.push({d:e.date,w:e.customer,n:e.g==='k'?'খেতেল':'বাকি খাতা',a:e.amount})});
  S.cash.filter(c=>inR(c.date)).forEach(c=>(c.dir==='in'?cin:cout).push({d:c.date,w:c.who||'',n:c.note||'নগদ',a:c.amount,id:c.id}));
  const mv={};S.moves.filter(x=>inR(x.date)).forEach(x=>{const p=prod(x.pid),pt=mvParts(x,p),o=mv[x.pid]||(mv[x.pid]={in:{bag:0,kg:0,q:0},out:{bag:0,kg:0,q:0}}),t=x.dir==='in'?o.in:o.out;t.bag+=pt.bag;t.kg+=pt.kg;t.q+=pt.q});
  const D={ms,sales,lsale:le('sale'),lowe:le('owe'),rbAmt:r2(rl.reduce((a,x)=>a+x,0)),mv,cin,cout};
  D.in=r2(cin.reduce((a,x)=>a+x.a,0));D.out=r2(cout.reduce((a,x)=>a+x.a,0));D.net=r2(D.in-D.out);
  return D;
}
function buckets(D){

  add(D.cin,'in');add(D.cout,'out');
  return[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o])=>({l:st.pm==='year'?new Date(k+'-01T00:00:00').toLocaleDateString('bn-BD',{month:'long'}):fdate(k),in:o.in,out:o.out}));
}

  const lab=B>0?'বাকি, আমরা পাব':(B<0?'আমরা দেব (সে পাবে)':'হিসাব সমান');

function makeSlip(){
  const msg=t=>{$('#cmsg').textContent=t;$('#cmsg').className='msg err'};
  const lines=st.cart.map(c=>{const p=prod(c.pid);return p&&c.qty>0?{pid:p.id,name:p.name,unit:p.unit,qty:c.qty,rate:c.rate,pb:p.perBag||0}:null}).filter(Boolean);
  if(!lines.length){msg('তালিকায় কোনো মাল নেই।');return}
  const total=r2(lines.reduce((a,l)=>a+l.qty*l.rate,0)),jer=Math.max(num(st.jer)||0,0),jdir=st.jdir==='owe'?'owe':'get',paid=Math.max(num(st.paid)||0,0),gave=Math.max(num(st.gave)||0,0),due=r2((jdir==='owe'?-jer:jer)+total-paid+gave);
  const name=st.cust.trim().replace(/\s+/g,' ');
  if(due!==0&&!name){msg('বাকি বা পাওনা থাকলে নাম দিতে হবে।');return}
  const no=S.memos.reduce((a,x)=>Math.max(a,x.no||0),0)+1;
  const rec={no,customer:name||'নগদ গ্রাহক',phone:st.cph.trim(),items:lines,total,jer,jdir,jerDate:jer>0?(st.jerd||''):'',paid,gave,due,date:st.bdate||today(),ts:Date.now()};
  showSlip(rec,false);
}
const inLedger=n=>n&&n!=='নগদ গ্রাহক'&&groups().some(x=>x.name===n);
async function memoLedger(rec,mid){
  const base={customer:rec.customer,phone:rec.phone||'',date:rec.date,note:'বিল নং '+bnn.format(rec.no),mid,ts:Date.now()},adds=[];
  if(rec.mode==='owe'){const net=r2(-(rec.total-rec.paid));if(net!==0)adds.push({...base,type:net>0?'sale':'pay',amount:Math.abs(net)})}
  else{if(rec.total>0)adds.push({...base,type:'sale',amount:rec.total});if(rec.paid>0)adds.push({...base,type:'pay',amount:rec.paid});if((rec.gave||0)>0)adds.push({...base,type:'gave',amount:rec.gave})}
  await Promise.all(adds.map(e=>col.entries.add(e)));
}

async function slipPng(html,w){

  const host=document.createElement('div');host.className='sx';host.style.cssText='position:fixed;left:-9999px;top:0;width:'+w+'px';
  host.innerHTML='<style>'+css+'</style>'+html;document.body.appendChild(host);

async function escposFromBlob(blob,dots,thr){
  const bmp=await createImageBitmap(blob);
  const W=Math.floor(dots/8)*8,H=Math.round(bmp.height*W/bmp.width);
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,W,H);
  const px=x.getImageData(0,0,W,H).data,bpr=W/8,mono=new Uint8Array(bpr*H);
  for(let y=0;y<H;y++)for(let i=0;i<W;i++){const o=(y*W+i)*4;if(0.299*px[o]+0.587*px[o+1]+0.114*px[o+2]<thr)mono[y*bpr+(i>>3)]|=0x80>>(i&7)}
  const parts=[Uint8Array.of(0x1B,0x40)];
  for(let y=0;y<H;y+=128){const r=Math.min(128,H-y);parts.push(Uint8Array.of(0x1D,0x76,0x30,0,bpr&255,bpr>>8,r&255,r>>8),mono.subarray(y*bpr,(y+r)*bpr))}
  parts.push(Uint8Array.of(0x1B,0x64,4),Uint8Array.of(0x1D,0x56,0x42,0));
  const out=new Uint8Array(parts.reduce((s,p)=>s+p.length,0));let o=0;for(const p of parts){out.set(p,o);o+=p.length}
  return out;
}

function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res({blob:b,url:c.toDataURL('image/jpeg',.8)}):rej(new Error('ছবি পড়া যায়নি')),'image/jpeg',.8)};im.onerror=()=>rej(new Error('ছবি পড়া যায়নি'));im.src=u})}
const fmsg=(id,t,c)=>{const e=$(id);if(e){e.textContent=t;e.className='msg '+(c||'')}};

async function saveProduct(f){
  const id=f.dataset.id,old=id?prod(id):null;
  const name=$('#pn').value.trim().replace(/\s+/g,' '),price=num($('#pp').value);
  if(!name||!(price>=0)){fmsg('#pmsg','নাম ও দর দিন।','err');return}
  let photo=old?old.photo||'':'';
  if(st.pend==='rm')photo='';
  else if(st.pend&&st.assets){try{const r=await st.assets.upload(st.pend.blob,{type:'image/jpeg'});photo=r.id}catch(e){fmsg('#pmsg','ছবি আপলোড হয়নি, ছবি ছাড়াই রাখছি।','err')}}
  const doc={name,perBag:Math.max(num($('#pb').value)||0,0),kind:'',unit:document.querySelector('input[name=pu]:checked').value,price,photo,emoji:old?old.emoji||'':'',ts:old?old.ts:Date.now()};
  try{
    if(id)await col.products.doc(id).set(doc);
    else{
      const ref=await col.products.add(doc);
      if(hasBK(doc)){const bg=Math.max(num($('#pob')&&$('#pob').value)||0,0),kk=Math.max(num($('#pok')&&$('#pok').value)||0,0);if(bg>0||kk>0)await col.moves.add({pid:ref.id,dir:'in',bag:bg,kg:kk,note:'শুরুর স্টক',date:today(),ts:Date.now()})}
      else{const q=Math.max(num($('#po')&&$('#po').value)||0,0);if(q>0)await col.moves.add({pid:ref.id,dir:'in',qty:q,note:'শুরুর স্টক',date:today(),ts:Date.now()})}
    }
    closeSheet();
  }catch(e){fmsg('#pmsg','সংরক্ষণ হয়নি। আবার চেষ্টা করুন।','err')}
}

    if(bkp){mvd.bag=bag;mvd.kg=kg}else mvd.qty=q;
    if(price>0)mvd.price=price;
    try{await col.moves.add(mvd);const pp=prod(f.dataset.id);if(pp){st.sp=pp.id;openSheet(stockSheet(pp));st.sp=pp.id}}catch(e){fmsg('#smsg','সংরক্ষণ হয়নি। আবার চেষ্টা করুন।','err')}
  }else if(f.id==='ef'){
    const customer=$('#en').value.trim().replace(/\s+/g,' '),amount=num($('#ea').value);
    if(!customer||!(amount>0)){fmsg('#emsg','নাম ও সঠিক টাকা দিন।','err');return}
    const type=document.querySelector('input[name=et]:checked').value;
    const doc={customer,type,amount,phone:$('#ep').value.trim(),date:$('#ed').value||today(),note:$('#ent').value.trim(),ts:Date.now()};
    if(f.dataset.g==='k'){doc.g='k';const cut=num($('#ecut')&&$('#ecut').value)||0;if(type==='owe'&&cut>0)doc.cut=Math.min(cut,amount)}
    try{await col.entries.add(doc);st.openC=customer;st.bk=f.dataset.g==='k'?'k':'c';closeSheet();setTab('baki')}catch(e){fmsg('#emsg','সংরক্ষণ হয়নি। আবার চেষ্টা করুন।','err')}
  }else if(f.id==='cf'){
    const name=$('#cn2').value.trim().replace(/\s+/g,' ');
    if(!name){fmsg('#cmsg2','নাম দিন।','err');return}
    const doc={type:f.dataset.t,name,phone:$('#cp2').value.trim(),address:$('#ca2').value.trim(),ts:Date.now()};
    try{if(f.dataset.id)await col.contacts.doc(f.dataset.id).set(doc);else await col.contacts.add(doc);closeSheet()}catch(e){fmsg('#cmsg2','সংরক্ষণ হয়নি। আবার চেষ্টা করুন।','err')}
  }else if(f.id==='rnf'){
    const name=$('#rnn').value.trim().replace(/\s+/g,' ');
    if(!name){fmsg('#rnmsg','নাম দিন।','err');return}
    const jer=Math.max(num($('#rnj').value)||0,0),jdir=(document.querySelector('input[name=rnd]:checked')||{}).value==='owe'?'owe':'get';
    const doc={customer:name,phone:$('#rnp').value.trim()||phoneOf(name),lines:[],pays:[],jer,jdir,jerDate:jer>0?($('#rnjd').value||''):'',date:today(),ts:Date.now()};
    try{const ref=await col.running.add(doc);const nr={id:ref.id,...doc};openSheet(rbSheet(nr));st.rbid=ref.id}catch(e){fmsg('#rnmsg','সংরক্ষণ হয়নি। আবার চেষ্টা করুন।','err')}
  }else if(f.id==='cashf'){
    const amount=num($('#camt').value);
    if(!(amount>0)){fmsg('#cashmsg','সঠিক টাকার অংক দিন।','err');return}
    try{await col.cash.add({dir:f.dataset.dir,amount,who:$('#cwho').value.trim().replace(/\s+/g,' '),note:$('#cnote').value.trim(),date:$('#cdate').value||today(),ts:Date.now()});closeSheet();if(st.tab==='day')renderDay()}catch(e){fmsg('#cashmsg','সংরক্ষণ হয়নি। আবার চেষ্টা করুন।','err')}
  }else if(f.id==='arotF'){
    try{await arotRef.set({phone:$('#arotIn').value.trim()});f.hidden=true}catch(e){$('#stor').textContent='নম্বর রাখা যায়নি।'}
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.navDay&&st.navDay!==today()){if(st.ddDay&&st.ddDay!==today()&&st.pm!=='range'){st.dd=today();st.ddDay=today()}render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)closeSheet()});

function setArot(p){
  st.arot=p;
  $('#arotTxt').innerHTML=p?`আড়তের ফোন: <a href='tel:${esc(dg(p))}' target='_top'>${esc(p)}</a>`:'আড়তের ফোন নম্বর এখনো দেওয়া হয়নি';
  $('#arotBtn').textContent=p?'বদলান':'নম্বর লিখুন';$('#arotIn').value=p;
}

/* ---------- ব্যাকআপ (সব ডেটা JSON) ---------- */
async function backupAll(){
  const say=(t,c)=>{const e=$('#bkmsg');e.textContent=t;e.className='msg '+c};
  let d=null;try{d=await claude.use('downloads')}catch(e){}
  if(!d){say('এই ভিউতে ডাউনলোড করা যাচ্ছে না।','err');return}
  say('ব্যাকআপ তৈরি হচ্ছে...','');
  const out={v:1,data:{},arot:st.arot||'',photos:{}};
  for(const k of Object.keys(S))out.data[k]=S[k];
  const pb=window.photoBlob||(id=>fetch('/_blob/'+id).then(r=>r.blob()));
  for(const p of S.products)if(p.photo&&!out.photos[p.photo]){try{const b=await pb(p.photo);out.photos[p.photo]=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b)})}catch(e){}}
  try{await d.save({filename:'akram-backup-'+today()+'.json',data:new Blob([JSON.stringify(out)],{type:'application/json'})});say('ব্যাকআপ নামানো হয়েছে। ফাইলটি নিরাপদ জায়গায় রাখুন, অন্য কাউকে দেবেন না।','ok')}
  catch(e){say(e&&e.code==='declined'?'ডাউনলোড বাতিল করা হয়েছে।':'ব্যাকআপ নামানো যায়নি।','err')}
}
$('#bkbtn').addEventListener('click',backupAll);

/* ---------- start ---------- */
async function init(){
  setArot('');render();
  let db=null,user=null;
  try{db=await claude.use('db')}catch(e){}
  try{user=await claude.use('user')}catch(e){}
  try{st.assets=await claude.use('assets')}catch(e){}
  try{st.canWrite=!!(user&&await user.isOwner())}catch(e){st.canWrite=false}
  if(!db){
    $('.wrap').querySelectorAll('section').forEach(s=>{s.hidden=true});$('#nav').hidden=true;$('#cbar').hidden=true;
    $('#stor').textContent='এই ব্রাউজারে ডেটা রাখা যাচ্ছে না। প্রাইভেট/ইনকগনিটো মোড বন্ধ করে আবার খুলুন।';return;
  }
  for(const k of ['products','moves','entries','memos','contacts','running','cash']){
    col[k]=db.collection(k);
    col[k].onSnapshot(s=>{S[k]=s.docs.map(d=>({id:d.id,...d.data()}));if(k==='memos')S[k].forEach(m=>(m.items||[]).forEach(i=>{i.name=cn(i.name)}));if(k==='running')S[k].forEach(r=>(r.lines||[]).forEach(l=>{l.name=cn(l.name)}));if(k==='moves'||k==='products')_bk=null;render()},()=>{$('#stor').textContent='খাতা লোড করা যায়নি। পেজ আবার খুলুন।'});
  }
  arotRef=db.doc('settings/arot');
  arotRef.onSnapshot(s=>{setArot(s.exists?String((s.data()||{}).phone||''):'')},()=>{});
  st.tab=st.canWrite?'pos':'baki';
  $('#stor').textContent='ডেটা এই ফোনের ব্রাউজারে জমা থাকে। প্রতিদিন প্রথমবার স্ক্রিন ছুঁলে নিজে থেকে ব্যাকআপ ফাইল নামবে (Downloads ফোল্ডারে)।';
  render();
}
init();
</script>
